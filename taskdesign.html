<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks – StudyPlanner</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="taskdesign.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="floating-shapes">
  <span class="shape s1"></span>
  <span class="shape s2"></span>
  <span class="shape s3"></span>
</div>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-image">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="user">
    </div>
    <h2>StudyPlanner</h2>
    <ul class="menu">
      <li onclick="location.href='dashboard.html'"><i class="fa-solid fa-house"></i> Dashboard</li>
      <li class="active"><i class="fa-solid fa-list-check"></i> Tasks</li>
      <li onclick="location.href='analytics.html'"><i class="fa-solid fa-chart-line"></i> Analytics</li>
      <li onclick="location.href='notes.html'"><i class="fa-solid fa-note-sticky"></i> Notes</li>
      <li onclick="location.href='studytips.html'"><i class="fa-solid fa-lightbulb"></i> Study Tips</li>
      <li onclick="location.href='profile.html'"><i class="fa-solid fa-user"></i> My Profile</li>
      <li class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div>
        <h1>Tasks</h1>
        <p>Manage your tasks efficiently 📋</p>
      </div>
      <button class="add-btn" onclick="openModal()">
        <i class="fa-solid fa-plus"></i> Add Task
      </button>
    </div>

    <!-- STATS CARDS -->
    <div class="stats">
      <div class="card total">
        <i class="fa-solid fa-layer-group"></i>
        <h3 id="totalCount">0</h3>
        <p>Total Tasks</p>
      </div>
      <div class="card completed">
        <i class="fa-solid fa-circle-check"></i>
        <h3 id="completedCount">0</h3>
        <p>Completed</p>
      </div>
      <div class="card pending">
        <i class="fa-solid fa-hourglass-half"></i>
        <h3 id="pendingCount">0</h3>
        <p>Pending</p>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." oninput="renderTable()">
      </div>
      <select class="filter" id="filterSelect" onchange="renderTable()">
        <option value="all">All Tasks</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Subject</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
      </table>
      <p id="emptyMsg" style="text-align:center;color:#aaa;padding:30px;display:none;">No tasks found.</p>
    </div>

  </div>
</div>

<!-- ADD TASK MODAL -->
<div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:999; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:24px; padding:36px; width:420px; max-width:90vw; box-shadow:0 30px 60px rgba(0,0,0,0.2); animation: popIn 0.3s ease;">
    <h2 style="color:#1e3c72; margin-bottom:6px;">Add New Task</h2>
    <p style="color:#aaa; font-size:13px; margin-bottom:24px;">Fill in the details below</p>

    <label style="font-size:13px; font-weight:600; color:#555;">Task Title</label>
    <input id="taskTitle" type="text" placeholder="e.g. Math Assignment"
      style="width:100%; padding:12px; border:2px solid #eef2ff; border-radius:12px; margin:8px 0 16px; font-size:14px; outline:none; font-family:inherit; box-sizing:border-box;">

    <label style="font-size:13px; font-weight:600; color:#555;">Subject</label>
    <input id="taskSubject" type="text" placeholder="e.g. Mathematics"
      style="width:100%; padding:12px; border:2px solid #eef2ff; border-radius:12px; margin:8px 0 16px; font-size:14px; outline:none; font-family:inherit; box-sizing:border-box;">

    <label style="font-size:13px; font-weight:600; color:#555;">Due Date</label>
    <input id="taskDate" type="date"
      style="width:100%; padding:12px; border:2px solid #eef2ff; border-radius:12px; margin:8px 0 24px; font-size:14px; outline:none; font-family:inherit; box-sizing:border-box;">

    <div style="display:flex; gap:12px;">
      <button onclick="closeModal()" style="flex:1; padding:13px; border-radius:14px; border:2px solid #eef2ff; background:white; font-size:14px; font-weight:600; cursor:pointer; color:#555; font-family:inherit;">Cancel</button>
      <button onclick="addTask()" style="flex:1; padding:13px; border-radius:14px; border:none; background:linear-gradient(135deg,#4a6cf7,#2f4ea2); color:white; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(74,108,247,0.35);">Add Task</button>
    </div>
  </div>
</div>

<style>
@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.status {
  padding: 5px 13px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.status-completed { background:#d1fae5; color:#065f46; }
.status-pending   { background:#fff3cd; color:#92400e; }
.status-missed    { background:#fee2e2; color:#991b1b; }
</style>
<audio id="completeSound" src="complete.mpeg" preload="auto"></audio>

<script src="api.js"></script>        
<script src="theme.js"></script>
<script src="taskdesign.js"></script>

</body>
</html>
